<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>🏭 إضافة مخزن جديد</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <!-- ✅ Control Bar محسّن وموزون -->
    <div class="control-bar">
        <!-- الجانب الأيسر: فارغ -->
        <div class="control-left"></div>
        
        <!-- الوسط: معلومات الصفحة -->
        <div class="control-center">
            <div class="user-greeting">
                <span class="greeting-text">🏭 إضافة مخزن جديد</span>
            </div>
        </div>
        
        <!-- الجانب الأيمن: الأزرار -->
        <div class="control-right">
            <a href="/" class="control-btn profile-btn" title="الرئيسية">
                <div class="btn-icon">🏠</div>
                <div class="btn-text">الرئيسية</div>
            </a>
            
            <a href="/logout" class="control-btn logout-btn" title="تسجيل الخروج">
                <div class="btn-icon">🚪</div>
                <div class="btn-text">خروج</div>
            </a>
        </div>
    </div>

    <div class="container">
        <div class="card" style="max-width:600px;margin:40px auto;">
            {% if error %}
            <div style="background:rgba(244,67,54,0.2);padding:20px;border-radius:15px;margin:-30px -30px 25px;border-left:5px solid #f44336;color:#f44336;font-weight:bold;text-align:center;">
                ❌ {{ error }}
            </div>
            {% endif %}
            
            <h2 style="text-align:center;color:#4fc3f7;margin-bottom:30px;">🏭 إضافة مخزن جديد</h2>
            
            <form method="POST">
                <label style="display:block;margin-bottom:8px;font-weight:bold;color:#4fc3f7;">
                    📦 اسم المخزن
                </label>
                <input type="text" 
                       name="name" 
                       placeholder="مثال: مخزن القاهرة الرئيسي" 
                       value="{{ request.form.get('name', '') }}"
                       maxlength="100"
                       minlength="2"
                       required 
                       autofocus
                       style="margin-bottom:25px;">
                
                <div style="display:flex;gap:15px;margin-top:30px;">
                    <button type="submit" 
                            class="btn" 
                            style="flex:1;background:linear-gradient(45deg,#4caf50,#45a049);padding:20px;font-size:18px;font-weight:bold;">
                        ✅ حفظ المخزن
                    </button>
                    <a href="/" 
                       class="btn" 
                       style="flex:1;background:linear-gradient(45deg,#757575,#616161);padding:20px;text-align:center;text-decoration:none;">
                        ❌ إلغاء
                    </a>
                </div>
            </form>
            
            {% if warehouses_count %}
            <div style="margin-top:25px;padding:15px;background:rgba(79,195,247,0.1);border-radius:15px;border:1px solid rgba(79,195,247,0.3);text-align:center;font-size:14px;font-weight:bold;">
                ✅ لديك {{ warehouses_count }} مخزن حالياً
            </div>
            {% endif %}

            <div style="margin-top:25px;padding:15px;background:rgba(79,195,247,0.1);border-radius:15px;border:1px solid rgba(79,195,247,0.3);font-size:14px;">
                <strong>💡 ملاحظات:</strong><br>
                ✅ اسم المخزن: 2-100 حرف<br>
                ✅ يجب أن يكون فريداً<br>
                ✅ استخدم أسماء واضحة (مثال: القاهرة، الجيزة، الإسكندرية)
            </div>
        </div>
    </div>

    <script>
        // ✅ إغلاق رسالة الخطأ تلقائياً
        const errorMsg = document.querySelector('div[style*="background:rgba(244,67,54"]');
        if (errorMsg) {
            setTimeout(() => {
                errorMsg.style.opacity = '0';
                setTimeout(() => errorMsg.remove(), 500);
            }, 6000);
        }
    </script>
</body>
</html>
