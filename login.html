<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <title>🏢 مدير المخازن - تسجيل الدخول</title>
    <link rel="stylesheet" href="/static/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3a 50%, #2d1b69 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            direction: rtl;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
        }
        
        .login-card {
            background: rgba(44, 44, 62, 0.98);
            backdrop-filter: blur(50px);
            padding: 60px 50px;
            border-radius: 35px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.7);
            animation: slideIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(79, 195, 247, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }
        
        .company-logo {
            font-size: 4em;
            text-align: center;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        .login-title {
            color: #4fc3f7;
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        
        .login-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            font-size: 16px;
            position: relative;
            z-index: 1;
        }
        
        .login-input {
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        
        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .login-input:focus {
            outline: none;
            border-color: #4fc3f7;
            box-shadow: 0 0 25px rgba(79, 195, 247, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .login-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(45deg, #4fc3f7, #ff6b9d);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(79, 195, 247, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(-1px);
        }
        
        .error-msg {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            padding: 15px;
            border-radius: 15px;
            margin: -20px -50px 30px;
            border-left: 5px solid #f44336;
            text-align: center;
            position: relative;
            z-index: 1;
            font-weight: bold;
        }
        
        .demo-info {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: rgba(79, 195, 247, 0.1);
            border-radius: 15px;
            font-size: 14px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(79, 195, 247, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="company-logo">🏢</div>
            <h1 class="login-title">مدير المخازن</h1>
            <p class="login-subtitle">نظام إدارة المخازن والمستودعات المتقدم</p>
            
            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}
            
            <form method="POST">
                <input type="text" 
                       name="username" 
                       class="login-input" 
                       placeholder="👤 اسم المستخدم" 
                       required 
                       autofocus>
                
                <input type="password" 
                       name="password" 
                       class="login-input" 
                       placeholder="🔒 كلمة السر" 
                       required>
                
                <button type="submit" class="login-btn">🚀 دخول النظام</button>
            </form>
            
            <div class="demo-info">
                <strong>🔑 بيانات الدخول الافتراضية:</strong><br>
                اسم المستخدم: <code style="background:rgba(255,255,255,0.1);padding:3px 8px;border-radius:5px;">admin</code><br>
                كلمة السر: <code style="background:rgba(255,255,255,0.1);padding:3px 8px;border-radius:5px;">admin123</code>
            </div>
        </div>
    </div>

    <script>
        // ✅ تسجيل الدخول بـ Enter
        document.addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                document.querySelector('.login-btn').click();
            }
        });
        
        // ✅ إزالة رسالة الخطأ تلقائياً
        const errorMsg = document.querySelector('.error-msg');
        if (errorMsg) {
            setTimeout(() => {
                errorMsg.style.opacity = '0';
                setTimeout(() => errorMsg.remove(), 500);
            }, 8000);
        }
    </script>
</body>
</html>
